<!-- Final message -->

<div id="finalMessage" style="display:none; font-size:40px; margin-top:40px;">
💖 Best Dad & Best Husband 💖
</div>

<!-- floating hearts -->

<div id="floatingHearts"></div>

<style>

#floatingHearts{
position:fixed;
bottom:0;
left:0;
width:100%;
pointer-events:none;
}

.floatingHeart{
position:absolute;
font-size:30px;
animation:floatHeart 4s linear infinite;
}

@keyframes floatHeart{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-600px);
opacity:0;
}
}

</style>

<script>

function startSurprise(){

document.getElementById("heartButton").style.display="none"

document.getElementById("loveMessage").style.display="block"

document.getElementById("videoSection").style.display="block"

document.getElementById("videoFrame").src="https://www.youtube.com/embed/fQ47TuFPDIQ?autoplay=1"

document.getElementById("fireworks").style.display="block"

launchFireworks()

// show final message after video (adjust seconds if needed)

setTimeout(showFinalMessage,60000)

}

function showFinalMessage(){

document.getElementById("finalMessage").style.display="block"

setInterval(createHeart,300)

}

function createHeart(){

let heart=document.createElement("div")

heart.className="floatingHeart"

heart.innerHTML="💖"

heart.style.left=Math.random()*100+"%"

document.getElementById("floatingHearts").appendChild(heart)

setTimeout(()=>heart.remove(),4000)

}

</script>
