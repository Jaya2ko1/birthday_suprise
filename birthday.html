<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(120deg,#f6d365,#fda085);
color:white;
text-align:center;
overflow:hidden;
}

.container{
margin-top:100px;
}

h1{
font-size:42px;
}

p{
font-size:20px;
max-width:600px;
margin:auto;
}

#openBtn{
margin-top:40px;
padding:18px 40px;
font-size:22px;
border:none;
border-radius:40px;
background:#ff2e63;
color:white;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
transition:0.3s;
}

#videoContainer{
margin-top:40px;
opacity:0;
transform:scale(0.6);
transition:0.6s ease;
}

video{
width:85%;
max-width:500px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

#finalMessage{
display:none;
margin-top:50px;
font-size:28px;
font-weight:bold;
}

.heart{
position:absolute;
color:red;
font-size:22px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh)}
100%{transform:translateY(-10vh)}
}

.confetti{
position:absolute;
width:10px;
height:10px;
animation:fall 4s linear infinite;
}

@keyframes fall{
0%{transform:translateY(-100px)}
100%{transform:translateY(100vh)}
}

</style>

</head>

<body>

<div class="container">

<h1>Happy Birthday My Love 🎂</h1>

<p>
Even though you are far away in Dubai,  
your Jamun and Kutty Jamun love you so much ❤️
</p>

<button id="openBtn" onclick="showVideo()">Open Your Surprise 🎁</button>

<div id="videoContainer">

<iframe width="90%" height="400"
src="https://www.youtube.com/embed/fQ47TuFPDIQ"
frameborder="0"
allowfullscreen>
</iframe>

</div>

<div id="finalMessage">
👶 Happy Birthday Appa ❤️ <br>
From your Kutty Jamun
</div>

</div>

<script>

function showVideo(){

for(let i=0;i<80;i++){

let conf=document.createElement("div")

conf.className="confetti"

conf.style.left=Math.random()*100+"%"

conf.style.background=`hsl(${Math.random()*360},100%,50%)`

conf.style.animationDuration=(Math.random()*3+2)+"s"

document.body.appendChild(conf)

}

let v=document.getElementById("videoContainer")

v.style.opacity="1"
v.style.transform="scale(1)"

document.getElementById("openBtn").style.display="none"

let video=document.getElementById("video")

video.play()

video.onended=function(){

document.getElementById("finalMessage").style.display="block"

for(let i=0;i<40;i++){

let heart=document.createElement("div")

heart.className="heart"

heart.innerHTML="❤️"

heart.style.left=Math.random()*100+"%"

heart.style.animationDuration=(Math.random()*5+5)+"s"

document.body.appendChild(heart)

}

}

}

</script>

</body>
</html>
