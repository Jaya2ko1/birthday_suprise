<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
text-align:center;
background:linear-gradient(to bottom,#ff9a9e,#fad0c4);
overflow-y:auto;
color:white;
}

/* section layout */

.section{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* title animation */

h1{
font-size:60px;
animation:fade 3s infinite alternate;
}

@keyframes fade{
from{opacity:0.5}
to{opacity:1}
}

/* scroll text */

.scroll{
font-size:22px;
margin-top:20px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(10px)}
}

/* heart */

.heart{
font-size:100px;
cursor:pointer;
animation:beat 1s infinite;
}

@keyframes beat{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

/* fireworks canvas */

#fireworks{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
display:none;
}

/* love message */

#loveMessage{
display:none;
font-size:40px;
margin-top:20px;
animation:fadeIn 2s;
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

/* video */

#videoSection{
display:none;
margin-top:30px;
}

iframe{
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

</style>

</head>

<body>

<canvas id="fireworks"></canvas>

<!-- first section -->

<div class="section">
<h1>🎉 Happy Birthday My Love ❤️</h1>
<p class="scroll">Scroll Down For Your Surprise ↓</p>
</div>

<!-- heart section -->

<div class="section">

<div class="heart" onclick="startSurprise()">❤️</div>

<h2>Click the Heart</h2>

<div id="loveMessage">
I Love You Forever ❤️
</div>

<div id="videoSection">

<iframe id="videoFrame" width="400" height="700"
src=""
allow="autoplay"
allowfullscreen>
</iframe>

</div>

</div>

<script>

function startSurprise(){

document.getElementById("loveMessage").style.display="block"

document.getElementById("videoSection").style.display="block"

document.getElementById("videoFrame").src="https://www.youtube.com/embed/fQ47TuFPDIQ?autoplay=1"

document.getElementById("fireworks").style.display="block"

launchFireworks()

}

/* simple fireworks */

const canvas=document.getElementById("fireworks")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

function launchFireworks(){

setInterval(()=>{

let x=Math.random()*canvas.width
let y=Math.random()*canvas.height/2

for(let i=0;i<50;i++){

ctx.beginPath()

ctx.arc(x+(Math.random()*100-50),y+(Math.random()*100-50),2,0,Math.PI*2)

ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`

ctx.fill()

}

setTimeout(()=>{

ctx.clearRect(0,0,canvas.width,canvas.height)

},500)

},700)

}

</script>

</body>
</html>
