<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open your gift 🎁</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:#ff9a9e;
font-family:sans-serif;
color:white;
text-align:center;
}

.gift{
font-size:100px;
cursor:pointer;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
0%{transform:translateY(0)}
50%{transform:translateY(-20px)}
100%{transform:translateY(0)}
}

</style>

</head>

<body>

<h1>Your Birthday Gift 🎁</h1>

<div class="gift" onclick="openBirthday()">🎁</div>

<p>Click the gift</p>

<script>

function openBirthday(){
window.location="birthday.html"
}

</script>

</body>
</html>
