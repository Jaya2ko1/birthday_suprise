<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answer honestly 😏</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
color:white;
text-align:center;
overflow:hidden;
}

h1{
font-size:32px;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:12px;
margin:15px;
cursor:pointer;
transition:0.3s;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

#jamun{
background:#ff2e63;
color:white;
}

#kutty{
background:white;
color:#ff2e63;
position:absolute;
}

#msg{
margin-top:30px;
font-size:20px;
}

</style>
</head>

<body>

<h1>Enaga ❤️<br>Ungaluku yara firstu pudikum?</h1>

<button id="jamun" onclick="openGift()">🍮 Jamun</button>
<button id="kutty" onmouseover="move()">👶 Kutty Jamun</button>

<p id="msg"></p>

<script>

let texts=[
"Press Jamun 😜",
"Jamun dhan firstu!",
"You have no choice!",
"Aiyo don't touch Kutty Jamun 😂",
"Correct answer Jamun!"
]

function move(){

let btn=document.getElementById("kutty")

btn.style.left=Math.random()*80+"%"
btn.style.top=Math.random()*80+"%"

document.getElementById("msg").innerText=
texts[Math.floor(Math.random()*texts.length)]

}

function openGift(){
window.location="gift.html"
}

</script>

</body>
</html>
